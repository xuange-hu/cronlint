[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cronlint"
version = "0.1.0"
description = "Zero-dependency crontab security auditor — expression parser with byte offsets, command-injection surface, overlap and privilege rules, two passes, evidence-first, SARIF for CI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "xuange-hu" }]
# Dependency-free on purpose: this has to run on the box that owns the crontab,
# which is usually the least provisioned one in the estate.
dependencies = []
keywords = [
  "security",
  "cron",
  "crontab",
  "scheduling",
  "command-injection",
  "audit",
  "static-analysis",
  "sarif",
  "devsecops",
  "linter",
  "linux",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
# mcp 2.x renamed FastMCP -> MCPServer and moved the import path; this server
# targets the 1.x line only.
mcp = ["mcp>=1.2,<3"]

[project.urls]
Homepage = "https://github.com/xuange-hu/cronlint"
Repository = "https://github.com/xuange-hu/cronlint"
Issues = "https://github.com/xuange-hu/cronlint/issues"

[project.scripts]
cronlint = "cronlint.cli:main"
cronlint-mcp = "cronlint.mcp_server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cronlint = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
